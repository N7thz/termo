name: Release

# Uma tag `v0.2.0` (com a mesma versão em package.json, Cargo.toml e tauri.conf.json) gera o instalador
# assinado e o `latest.json` que a atualização automática do Termo lê.
# Segredos do repositório: TAURI_SIGNING_PRIVATE_KEY (conteúdo de ~/.tauri/termo.key) e, se a chave
# tiver senha, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Termo ${{ github.ref_name }}
          releaseBody: Veja as mudanças nos commits desde a versão anterior.
          releaseDraft: false
          # Os artefatos de atualização (.sig e latest.json) só aqui: o build do CI não tem a chave.
          args: --config {"bundle":{"createUpdaterArtifacts":true}}
          includeUpdaterJson: true
