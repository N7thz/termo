[package]
name = "termo-cli"
version = "0.1.0"
description = "Linha de comando do Termo: controla o Termo aberto (abas, comandos, Claude Code)"
edition = "2021"
license = "MIT"
publish = false

# Fora do workspace do app: binário de console pequeno, só com std e serde_json.
[workspace]

[[bin]]
name = "termo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
