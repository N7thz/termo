[package]
name = "termo"
version = "0.2.2"
description = "Terminal moderno inspirado no Warp"
edition = "2021"
authors = ["N7thz"]
license = "MIT"
repository = "https://github.com/N7thz/termo"

[lib]
name = "termo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
which = "7"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
png = "0.17"
tauri-plugin-log = "2"
log = "0.4"

# Modo leve em segundo plano (memory.rs): as mesmas versões que o Tauri já usa.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
